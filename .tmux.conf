cat > ~/.tmux.conf << 'EOF'
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 50000
set -sg escape-time 0
set -g focus-events on
setw -g aggressive-resize on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind r source-file ~/.tmux.conf \; display "Configuración recargada"

set -g mode-keys vi
set -g status-keys vi

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind -T copy-mode-vi Escape send -X cancel

set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#14532d,fg=#dcfce7"
set -g status-left-length 30
set -g status-right-length 60
set -g status-left "#[bg=#22c55e,fg=#052e16,bold] #S #[default] "
set -g status-right "#{?client_prefix,#[bg=#facc15 fg=#052e16 bold] PREFIX #[default] ,}#[fg=#86efac]%d-%m-%Y #[bg=#22c55e,fg=#052e16,bold] %H:%M "
setw -g window-status-format "#[fg=#86efac] #I:#W "
setw -g window-status-current-format "#[bg=#22c55e,fg=#052e16,bold] #I:#W#{?window_zoomed_flag, [Z],} "
set -g pane-border-style "fg=#166534"
set -g pane-active-border-style "fg=#22c55e"
set -g message-style "bg=#22c55e,fg=#052e16,bold"
set -g mode-style "bg=#22c55e,fg=#052e16"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

if-shell '[ -z "$TMUX_CAMBIOS" ]' "run '~/.tmux/plugins/tpm/tpm'"
EOF
